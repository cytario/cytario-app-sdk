[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cytario_app_sdk"]

[project]
name = "cytario-app-sdk"
version = "0.2.0"
description = "CLI for registering Cytario analysis applications in an OCI Distribution v1.1 registry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cytario" },
]
keywords = [
  "cytario",
  "oci",
  "distribution-spec",
  "harbor",
  "referrer",
  "app-definition",
  "catalog",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "typer-config[yaml]>=1.4",
]

[project.urls]
Homepage = "https://github.com/cytario/cytario-app-sdk"
Repository = "https://github.com/cytario/cytario-app-sdk"
Issues = "https://github.com/cytario/cytario-app-sdk/issues"
Changelog = "https://github.com/cytario/cytario-app-sdk/releases"

[project.scripts]
cytario-app-sdk = "cytario_app_sdk.cli:app"

[project.optional-dependencies]
runtime = [
    "boto3>=1.43.62",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "respx>=0.21",
  "ruff>=0.6",
  "python-semantic-release>=10",
  "moto>=5.2.2",
]

# ---------------------------------------------------------------------------
# python-semantic-release — automatic version bump + GitHub release +
# sdist/wheel build. Runs from .github/workflows/release.yml in "no-commit"
# mode: `version --no-commit --no-tag --no-changelog --skip-build` stamps the
# version into the working tree, then `publish --tag v<x>` builds and creates
# the GitHub Release (the tag is created by GitHub pointing at HEAD, so no new
# commit is added to main). Release notes live on the GitHub Release, not in a
# CHANGELOG.md file. PyPI publishing is handled separately by
# pypa/gh-action-pypi-publish via trusted publishing (OIDC), so it is disabled
# here.
# ---------------------------------------------------------------------------
[tool.semantic_release]
commit_parser = "conventional"
version_variables = ["src/cytario_app_sdk/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "uv build"
commit_author = "github-actions <actions@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release."
publish_to_pypi = false
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # trailing-comma rule conflicts with the formatter
  "ISC001",  # implicit-string-concat conflicts with the formatter
  "D203",    # one-blank-line-before-class (conflicts with D211)
  "D213",    # multi-line-summary-second-line (conflicts with D212)
  "FBT001",  # boolean-typed positional/keyword args are idiomatic Typer flags
  "FBT002",
  "FBT003",
  "CPY001",  # no copyright-notice convention in sibling Cytario repos
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",    # asserts are the point of a test suite
  "S105",    # "hardcoded password" strings are test fixtures
  "S106",    # same, as a function argument
  "S107",    # same, as a function default arg
  "D",       # docstrings not required on every test function
  "ANN",     # type annotations not required in tests
  "ARG001",  # side-effecting fixtures are requested but not read
  "PLR2004", # magic numbers are fine in test expectations
  "PLR0913", # fixtures legitimately take many parameters
  "PLR0917", # same, positional count
  "INP001",  # tests dir is intentionally not a package
  "SLF001",  # tests legitimately exercise private helpers
  "PT004",   # pytest fixture naming without returns is fine
  "TC003",   # fixtures use Path at runtime; type-checking blocks add noise
]

"src/cytario_app_sdk/cli.py" = [
  "PLR0913", # Typer command signatures legitimately take many options
  "PLR0917", # same, positional count from Annotated defaults
  "TC003",   # `Path` is needed at runtime for typer's get_type_hints resolution
  "PLC0415", # lazy imports gate the optional boto3 dependency in the `run` command
]

"src/cytario_app_sdk/oci/client.py" = [
  "PLR2004", # HTTP status codes (200, 201, 202) are idiomatic literals
  "TRY003",  # long exception messages are fine for a CLI-facing client
  "EM102",   # f-strings in exception messages are fine here
]

"src/cytario_app_sdk/broker/client.py" = [
  "PLR2004", # HTTP status codes (400, 401, 403) are idiomatic literals
]

"src/cytario_app_sdk/broker/exceptions.py" = [
  "N818",   # GrantRevoked/GrantExpired/BrokerUnreachable read as states, not Error nouns
]

"src/cytario_app_sdk/broker/aws.py" = [
  "PLC0415", # lazy imports gate the optional boto3 dependency
  "SLF001",  # botocore_session._credentials is the de facto injection point
  "TC001",   # BrokerClient/BrokerCredentials used at runtime under TYPE_CHECKING guard
]

"src/cytario_app_sdk/runtime/spawn.py" = [
  "BLE001",  # broad except is intentional — surface any infra failure as exit 70
  "PLR0913", # run_job legitimately takes many kwargs for the wrapper flow
  "TRY400",  # logging.error with exc is fine; we don't want stack traces in container logs
]

"tests/runtime/*" = [
  "S101",    # asserts are the point of a test suite
  "BLE001",  # broad except in test helpers is fine
]

"tests/broker/*" = [
  "DTZ001", # naive datetimes are intentional to test the UTC-assumption path
  "PLC0415", # lazy imports inside test functions exercise the import-guard path
  "SLF001",  # _refresh_using/_protected_refresh/_credentials are the test seams
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
