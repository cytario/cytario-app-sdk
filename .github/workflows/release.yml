name: Release

# Cuts a new release on every push to `main` that warrants one, using
# python-semantic-release driven by Conventional Commits — WITHOUT creating a
# new commit on `main` (org policy forbids that). Instead:
#
#   1. `semantic-release version --no-commit --no-tag --no-push --no-vcs-release
#      --no-changelog --skip-build` computes the next version and stamps it into
#      pyproject.toml / src/cytario_app_sdk/__init__.py in the working tree only.
#   2. `semantic-release publish --tag v<version>` runs `uv build` and creates the
#      GitHub Release for that tag. GitHub creates the tag itself, pointing at the
#      current HEAD commit — no new commit, no push to `refs/heads/main`.
#
# Release notes are generated from the commit history and attached to the
# GitHub Release (no CHANGELOG.md file is maintained on the branch). The built
# sdist + wheel are also uploaded as a workflow artifact for the `publish`
# job, which pushes them to PyPI via trusted publishing (OIDC) — no API token
# is stored in the repo. The first release needs the project registered as a
# PyPI trusted publisher (see CONTRIBUTING.md).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull tags created by previous runs (GitHub Releases create tags via
      # the API, not via git push) so PSR can see the last released version.
      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Detect next version
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="$(uv run semantic-release version --print 2>/dev/null | tail -1 | tr -d '[:space:]')"
          LAST="$(uv run semantic-release version --print-last-released 2>/dev/null | tail -1 | tr -d '[:space:]')"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          if [ -n "$NEXT" ] && [ "$NEXT" != "$LAST" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version, create local tag & build distributions
        if: steps.detect.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stamp the next version into the working tree and create the tag
          # locally at HEAD, but do NOT commit, push, create a VCS release, or
          # write a changelog file. `publish` (next step) needs the local tag and
          # runs `uv build` itself, so we skip the build here too.
          uv run semantic-release version \
            --no-commit --no-push --no-vcs-release --no-changelog --skip-build

      - name: Publish GitHub release
        id: publish
        if: steps.detect.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `publish` runs build_command (`uv build`) then creates the GitHub
          # Release for the tag. GitHub creates the tag on the remote pointing
          # at HEAD — no new commit on main, no git push.
          uv run semantic-release publish --tag "${{ steps.detect.outputs.tag }}"

      - name: Upload distribution artifacts
        if: steps.detect.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next version**: ${{ steps.detect.outputs.next }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Last released**: ${{ steps.detect.outputs.last }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.detect.outputs.released }}" == "true" ]; then
            echo "- **Released**: ✓ ${{ steps.detect.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.detect.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Released**: ✗ No changes warranting a release" >> $GITHUB_STEP_SUMMARY
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.released == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/cytario-app-sdk/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          verbose: true

      - name: Generate Summary
        if: always()
        run: |
          echo "## PyPI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI**: https://pypi.org/project/cytario-app-sdk/${{ needs.release.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
