name: Release

# Cuts a new release on every push to `main` that warrants one, using
# python-semantic-release driven by Conventional Commits. It:
#   1. bumps the version, updates CHANGELOG.md, stamps the version into
#      pyproject.toml and src/cytario_app_sdk/__init__.py, commits and tags,
#   2. builds the sdist + wheel (`uv build`),
#   3. publishes a GitHub release with the changelog + built artifacts, and
#   4. publishes the artifacts to PyPI via trusted publishing (OIDC) — no
#      API token is stored in the repo. The first release needs the project
#      registered as a PyPI trusted publisher (see CONTRIBUTING.md).
#
# We run `semantic-release` via `uv run` (not the wrapper action) so the
# `uv build` build_command inherits the host PATH where `setup-uv` placed
# the `uv` binary. The wrapper action runs PSR in a Docker container that
# does not contain `uv`, which makes `uv build` fail with "command not found".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Run python-semantic-release directly so `uv build` (the build_command)
      # runs on the host with `uv` on PATH. GH_TOKEN gives PSR the push access
      # it needs to commit+tag the release back to the repo.
      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release -v version

          # PSR commits+tags the release commit when a release is warranted.
          # A tag pointing at HEAD means a release was published this run.
          TAG="$(git tag --points-at HEAD)"
          if [ -n "$TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release assets
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Upload distribution artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release.outputs.released }}" == "true" ]; then
            echo "- **Released**: ✓ ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Released**: ✗ No changes warranting a release" >> $GITHUB_STEP_SUMMARY
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.released == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/cytario-app-sdk/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          verbose: true

      - name: Generate Summary
        if: always()
        run: |
          echo "## PyPI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI**: https://pypi.org/project/cytario-app-sdk/${{ needs.release.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
