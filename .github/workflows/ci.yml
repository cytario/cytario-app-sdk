name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: "Europe/Berlin"

jobs:
  lint-and-test:
    name: Lint, format check & test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        id: format_step
        run: uv run ruff format --check

      - name: Run linter
        id: lint_step
        run: uv run ruff check

      - name: Run tests
        id: test_step
        run: uv run pytest

      - name: Build package
        id: build_step
        run: uv build

      - name: Generate Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Ruff format: ${{ steps.format_step.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Ruff check:  ${{ steps.lint_step.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pytest:       ${{ steps.test_step.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- uv build:     ${{ steps.build_step.outcome }}" >> $GITHUB_STEP_SUMMARY

  freeze-build:
    name: Frozen runtime binary builds & boots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (with runtime extra)
        run: uv sync --extra runtime

      - name: Build frozen binary
        run: uv run --with cx_Freeze python freeze/setup.py build

      - name: Smoke test frozen binary
        run: |
          BIN="$(echo build/exe.linux-x86_64-*/cytario-app-sdk)"
          "$BIN" --help >/dev/null
          "$BIN" register --dry-run examples/cellseg.yaml >/dev/null

          # Minimal broker stand-in: answers the mint POST with STS-shaped
          # credentials so the run smoke reaches the spawn phase without
          # real S3 traffic (no inputs/outputs declared).
          python3 - <<'EOF' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Mint(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.dumps({
                      "accessKeyId": "ASIAEXAMPLE",
                      "secretAccessKey": "secret",
                      "sessionToken": "token",
                      "expiration": "2099-01-01T00:00:00Z",
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 9999), Mint).serve_forever()
          EOF

          CYTARIO_BROKER_ENDPOINT=http://localhost:9999 \
          CYTARIO_BROKER_TOKEN=dummy \
          CYTARIO_INPUT_URIS='[]' \
          CYTARIO_OUTPUT_URI='' \
          CYTARIO_PARAMETERS='{"tile-size":256,"silent":true}' \
            "$BIN" run --input-dir "$(mktemp -d)/in" --output-dir "$(mktemp -d)/out" -- /bin/echo ok

      - name: Generate Summary
        if: always()
        run: |
          echo "## Frozen Binary Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  runtime-container:
    name: Runtime container builds (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Full docker build of freeze/Dockerfile.runtime with a fresh pip
      # dependency resolution (no uv.lock) — exactly what the release-time
      # runtime-image build does — followed by the same in-image smoke. This
      # is what catches freeze breakage from unpinned dependency drift before
      # merge (e.g. typer >= 0.27 no longer depending on click).
      - name: Build runtime image (no push, load locally)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: freeze/Dockerfile.runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: cytario-app-sdk-runtime:ci
          cache-from: type=gha,scope=runtime-container
          cache-to: type=gha,mode=max,scope=runtime-container

      - name: Smoke test the frozen binary in the image
        run: |
          docker run --rm \
            --entrypoint /opt/sdk/bin/cytario-app-sdk \
            cytario-app-sdk-runtime:ci --help >/dev/null
          docker run --rm \
            --entrypoint /opt/sdk/bin/cytario-app-sdk \
            -v "$PWD/examples/cellseg.yaml:/app-definition.yaml:ro" \
            cytario-app-sdk-runtime:ci \
            register --dry-run /app-definition.yaml >/dev/null

      - name: Generate Summary
        if: always()
        run: |
          echo "## Runtime Container Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
