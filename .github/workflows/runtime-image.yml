name: Runtime image

# Builds the frozen wrapper binary (freeze/setup.py, freeze/Dockerfile.runtime)
# and publishes it as harbor.cytario.org/oss/cytario-app-sdk-runtime:<ver>, the
# base image non-Python apps COPY --from= to get wrapper mode.
#
# Called from release.yml as a job after the semantic-release job has cut
# <ver> — NOT triggered by the tag push itself: the tag is pushed by
# semantic-release using GITHUB_TOKEN, and events created by GITHUB_TOKEN
# never trigger new workflow runs (GitHub recursion protection), so a tag
# trigger would never fire in this repo.
#
# The image is intentionally public-registry-compatible (oss project): it
# contains only our own MIT-licensed code and its open-source dependencies,
# no Cytario-internal material.

on:
  workflow_call:
    inputs:
      version:
        description: "The released SDK version (image tag)"
        required: true
        type: string
    # Declared explicitly so callers forward exactly these — no blanket
    # secrets: inherit, which would hand every repo/org secret to this
    # workflow. The consuming job runs in the `dev` environment (declared
    # on the job below), scoping the robots to dev.
    secrets:
      HARBOR_USERNAME:
        description: "Robot name with push access to the oss project"
        required: true
      HARBOR_TOKEN:
        description: "Robot token with push access to the oss project"
        required: true

env:
  REGISTRY_HARBOR: harbor.cytario.org
  IMAGE_HARBOR: harbor.cytario.org/oss/cytario-app-sdk-runtime

jobs:
  build-and-push:
    name: Build and push runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev # HARBOR_* secrets come from this environment
    permissions:
      contents: read
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HARBOR }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push to Harbor
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: freeze/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_HARBOR }}:${{ inputs.version }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image

      # Smoke: the frozen binary boots on the distroless runtime and parses
      # its CLI (typer/rich/pydantic all load). The dry-run register mounts
      # the example app-definition from the checkout — the runtime image
      # itself contains only /opt/sdk. The full run path (broker mint,
      # download, spawn, upload) needs a live broker and is exercised in
      # the freeze-build CI job.
      - name: Smoke test the frozen binary
        run: |
          docker run --rm \
            --entrypoint /opt/sdk/bin/cytario-app-sdk \
            "${IMAGE_HARBOR}@${{ steps.push.outputs.digest }}" --help >/dev/null
          docker run --rm \
            --entrypoint /opt/sdk/bin/cytario-app-sdk \
            -v "$PWD/examples/cellseg.yaml:/app-definition.yaml:ro" \
            "${IMAGE_HARBOR}@${{ steps.push.outputs.digest }}" \
            register --dry-run /app-definition.yaml >/dev/null

      - name: Install crane
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin crane

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign "${IMAGE_HARBOR}@${DIGEST}"

      - name: Tag latest (full releases only)
        if: ${{ !contains(inputs.version, '-') }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          crane tag "${IMAGE_HARBOR}@${DIGEST}" latest

      - name: Generate Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Runtime Image Summary"
            echo ""
            echo "- **Status**: ${STATUS}"
            echo "- **Version**: ${VERSION}"
            echo "- **Image**: ${IMAGE_HARBOR}:${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
