schemaVersion: 1
applicationId: cellseg
name: Cell Segmentation
description: Runs Cellpose on a 16-bit OME-TIFF.
image:
  repository: cytario/cellseg
  tag: "1.0.0"
parameterSchema:
  - name: diameter
    label: Diameter
    type: number
    required: false
    default: 30
    description: Cellpose diameter estimate in pixels.
dataRoles:
  - name: image
    kind: input
  - name: segmentation
    kind: output
resources:
  requests:
    cpu: "2000m"
    memory: "8Gi"
    memoryPerInputGb: "1Gi"
    ephemeralStorage: "20Gi"
    ephemeralStoragePerInputGb: "2Gi"
    gpu: 1
